<!DOCTYPE html>
<html>
<head>
<title>Tickets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="Logo/logo.jpg">

<style>
* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) {
    *, .sidebar, .main { animation: none !important; transition: none !important; }
}

* {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    background: #f4f6f9;
    overflow-x: hidden;
}

/* SIDEBAR (SAME AS DASHBOARD) */
.sidebar {
    width: 270px;
    background: #1f2937;
    color: white;
    height: 100vh;
    padding: 20px;
    position: fixed;
    left: 0;
    top: 0;
    transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
}


.sidebar.collapsed {
    transform: translateX(-100%);
}

/* main also shifts */
.main {
    will-change: margin-left;
}


/* ensure smooth when clicking nav/menu */
/* will-change is set per-element above to avoid conflicting transition behavior */



.sidebar h2 {
    text-align: center;
    margin-bottom: 40px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #374151;
    color: white;
}

.logout-btn {
    color: #f87171 !important;
}

.logout-btn:hover {
    background: #7f1d1d;
    color: white !important;
}

hr {
    border: 0;
    border-top: 1px solid #374151;
    margin: 20px 0;
}

/* MAIN (SAME SHIFT EFFECT) */
.main {
    flex: 1;
    margin-left: 0;
    padding: 30px 40px;
    transition: margin-left 360ms cubic-bezier(0.22, 1, 0.36, 1);
    width: 100%;
}


.main.full {
    margin-left: 270px;
}

/* TOPBAR */
.topbar {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 30px;
}

.menu-btn {
    background: #1f2937;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.menu-btn:hover {
    background: #111827;
}

/* CARD */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    animation: riseIn 420ms ease both;
}

@keyframes riseIn {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover {
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
}

/* BUTTONS */
button {
    padding: 6px 10px;
    margin: 2px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

/* (override existing button rules below if any) */
/* (remove duplicate button rule) */
/* button duplicate removed to avoid overriding the motion styles above */

button:hover {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 12px 24px rgba(37,99,235,0.18);
}

button:active {
    transform: translateY(1px) scale(0.99);
}

.edit { background: orange; color: white; }
.delete { background: red; color: white; }
/* DARK MODE */
body.dark {
    background: #111827;
    color: #f9fafb;
}
body.dark .card {
    background: #1f2937;
}
body.dark th {
    background: #374151;
    color: #f9fafb;
}
body.dark td { border-bottom-color: #374151; }
body.dark .sidebar { background:#020617; }
body.dark .sidebar a { color:#d1d5db; }
body.dark input { background:#374151; color:#f9fafb; border-color:#555; }

body.dark .logout-btn { color:#f87171 !important; }
body.dark button.edit { background: #f59e0b; }
body.dark button.delete { background: #ef4444; }

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar collapsed" id="sidebar">
    <h2>Support Admin</h2>
    <a href="adminDashboard.html">Dashboard</a>
    <a href="tickets.html">Tickets</a>
    <a href="operators.html">Operators</a>
    <a href="settings.html">Settings</a>
    <hr>
<a href="#" onclick="logout()" class="logout-btn" title="Logout">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="vertical-align:-3px;margin-right:8px;">
      <path d="M10 16V18C10 19.1046 10.8954 20 12 20H20C21.1046 20 22 19.1046 22 18V6C22 4.89543 21.1046 4 20 4H12C10.8954 4 10 4.89543 10 6V8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 12H16" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 12L10 9" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 12L10 15" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Logout
</a>

</div>

<!-- MAIN -->
<div class="main" id="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="vertical-align:-3px;margin-right:8px;">
              <path d="M4 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Menu
        </button>

        <h1>Tickets Management</h1>
    </div>

    <!-- SEARCH -->
    <div class="card">
        <h3>Search Tickets</h3>
        <input 
            id="searchInput" 
            placeholder="Search by title, description or status..."
            style="width: 300px; padding: 8px; border-radius: 6px; border: 1px solid #ccc;"
            onkeyup="searchTickets()"
        >
    </div>

    <!-- TABLE -->
    <div class="card">
        <h3>All Tickets</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ticketList"></tbody>
        </table>
        <button id="loadMoreBtn" type="button" onclick="loadMoreTickets()" hidden>Load more tickets</button>
    </div>

</div>

<script>
let tickets = [];
let ticketOffset = 0;
let loadingTickets = false;

// LOAD DATA
async function displayTickets(append = false) {
    if (loadingTickets) return;
    loadingTickets = true;
    if (!append) {
        ticketOffset = 0;
        tickets = [];
    }
    try {
        const res = await fetch(`/api/tickets?limit=50&offset=${ticketOffset}`, { cache: "no-store" });
        if (res.status === 401 || res.status === 403) {
            window.location.href = "role.html";
            return;
        }
        if (!res.ok) throw new Error("Failed to load tickets");
        const data = await res.json();
        tickets = append ? tickets.concat(data) : data;
        ticketOffset += data.length;
        renderTickets(tickets);
        document.getElementById("loadMoreBtn").hidden = data.length < 50;
    } catch (error) {
        console.error(error);
        document.getElementById("ticketList").innerHTML = '<tr><td colspan="5">Unable to load tickets. <button type="button" onclick="displayTickets()">Retry</button></td></tr>';
    } finally {
        loadingTickets = false;
    }
}

function loadMoreTickets() {
    displayTickets(true);
}

// SEARCH
function searchTickets() {
    let keyword = document.getElementById("searchInput").value.toLowerCase();

    let filtered = tickets.filter(t => 
        (t.title && t.title.toLowerCase().includes(keyword)) ||
        (t.description && t.description.toLowerCase().includes(keyword)) ||
        (t.status && t.status.toLowerCase().includes(keyword))
    );

    renderTickets(filtered);
}

// RENDER
function renderTickets(data) {
    let output = "";

    if (data.length === 0) {
        output = `<tr><td colspan="5" style="text-align:center;">No tickets found</td></tr>`;
    } else {
        data.forEach(ticket => {
            output += `
            <tr>
                <td>${ticket.id}</td>
                <td>${escapeHtml(ticket.title)}</td>
                <td>${escapeHtml(ticket.description || "-")}</td>
                <td>${escapeHtml(ticket.status)}</td>
                <td>
                    <button class="edit" data-action="edit" data-id="${ticket.id}">Edit</button>
                    <button class="delete" data-action="delete" data-id="${ticket.id}">Delete</button>
                </td>
            </tr>
            `;
        });
    }

    function escapeHtml(value) {
        const node = document.createElement("div");
        node.textContent = value == null ? "" : String(value);
        return node.innerHTML;
    }

    document.getElementById("ticketList").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const ticket = tickets.find(item => String(item.id) === button.dataset.id);
        if (!ticket) return;
        if (button.dataset.action === "edit") editTicket(ticket.id, ticket.title, ticket.description || "");
        if (button.dataset.action === "delete") deleteTicket(ticket.id);
    });

    document.getElementById("ticketList").innerHTML = output;
}

// EDIT
function editTicket(id, oldTitle, oldDesc) {
    let newTitle = prompt("Edit title:", oldTitle);
    if (!newTitle) return;

    let newDesc = prompt("Edit description:", oldDesc);

    fetch(`/api/tickets/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            title: newTitle,
            description: newDesc
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Update failed");
        return displayTickets();
    })
    .catch(error => alert(error.message));
}

// DELETE
function deleteTicket(id) {
    if (!confirm("Delete ticket?")) return;

    fetch(`/api/tickets/${id}`, { method: "DELETE" })
    .then(res => {
        if (!res.ok) throw new Error("Delete failed");
        return displayTickets();
    })
    .catch(error => alert(error.message));
}

// SAME SMOOTH FUNCTION AS DASHBOARD
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("main").classList.toggle("full");
}

// LOGOUT
function logout() {
    fetch("/api/logout", { method: "POST" }).finally(() => {
        window.location.href = "role.html";
    });
}

// Apply dark mode
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark");
}

// LOAD
displayTickets();
</script>

</body>
</html>
