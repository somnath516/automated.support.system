<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Operator Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Logo/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
    --motion-fast: 180ms;
    --motion-med: 420ms;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

body {
    margin: 0;
  font-family:'Poppins',sans-serif;
  display:flex;
  background:#f4f6f9;
  opacity:0;
  animation:pageIn 0.3s ease-out forwards;
}

@keyframes pageIn { to { opacity:1; } }

.sidebar{
  width:270px;
  background:#1f2937;
  color:white;
  height:100vh;
  padding:20px;
  position:fixed;
  transition:transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change:transform;
}

.sidebar.collapsed{transform:translateX(-100%);}

.sidebar h2{text-align:center;margin-bottom:40px;}

.sidebar a{
  display:block;
  color:#d1d5db;
  text-decoration:none;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
}

.sidebar a:hover{background:#374151;color:white;}

.logout-btn{color:#f87171!important;margin-top:20px;}

.main{
  flex:1;
  margin-left:0;
  padding:30px 40px;
  width:100%;
  transition:margin-left 360ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change:margin-left;
}

.main.full{margin-left:270px;}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:30px;
}

.menu-btn{
  background:#1f2937;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
}

.kpi-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-bottom:30px;
}

.kpi{
  background:white;
  padding:25px;
  border-radius:14px;
  transition: transform var(--motion-fast) ease, box-shadow var(--motion-fast) ease, background-color var(--motion-fast) ease;
  animation: riseIn var(--motion-med) ease both;

  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.kpi h4{font-size:14px;color:#6b7280;}
.kpi h2{font-size:30px;margin:0;}

.middle-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.left-section .block,
.left-section .chart-box{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

.right-section .chart-box,
.right-section .recent-box{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

#recentTickets{
  max-height:220px;
  overflow-y:auto;
  margin-top:10px;
}

#recentTickets::-webkit-scrollbar{
  width:6px;
}

#recentTickets::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px;
}

.recent-box::-webkit-scrollbar{
  width:6px;
}

.recent-box::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px;
}

/* âœ… Table scroll (unchanged) */
.table-container{
  max-height:260px;
  overflow-y:auto;
}

.loading-row td{color:#6b7280;text-align:center;padding:24px;}
.loading-row td::after{
  content:"";display:inline-block;width:16px;height:16px;margin-left:8px;
  vertical-align:-3px;border:2px solid #d1d5db;border-top-color:#2563eb;
  border-radius:50%;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.table-container thead th{
  position:sticky;
  top:0;
  background:#f3f4f6;
  z-index:1;
}

/* âœ… FIXED: Chart height increased (ONLY needed fix) */
.chart-box{
  height:300px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* Dark mode */
body.dark{ background:#111827; color:#f9fafb; }
body.dark .sidebar{ background:#020617; }
body.dark .sidebar a:hover{ background:#374151; color:#fff; }
body.dark .kpi, body.dark .block, body.dark .chart-box, body.dark .recent-box{ background:#1f2937; }
body.dark .recent-ticket-row{ background:#111827; }
body.dark .table-container thead th{ background:#374151; }
body.dark .recent-box::-webkit-scrollbar-thumb,
body.dark #recentTickets::-webkit-scrollbar-thumb{ background:#4b5563; }

.chart-box canvas{
  width:100% !important;
  height:100% !important;
}

/* remaining */

.recent-ticket-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-bottom:12px;
  background:#f9fafb;
  border-radius:8px;
  font-size:14px;
}

.status-badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  color:white;
  font-weight:500;
}

.status-open{background:#3b82f6;}
.status-progress{background:#f59e0b;}
.status-closed{background:#10b981;}

table{width:100%;border-collapse:collapse;}
th,td{padding:14px;border-bottom:1px solid #eee;text-align:left;}
th{background:#f3f4f6;}

.badge{
  padding:4px 10px;
  border-radius:12px;
  color:white;
  font-size:12px;
}

.High{background:#ef4444;}
.Medium{background:#f59e0b;}
.Low{background:#10b981;}

button.action{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
  color:white;
}

.progress-btn{background:#f59e0b;}
.close-btn{background:#10b981;}

</style>
</head>

<body>

<div class="sidebar collapsed" id="sidebar">
<h2>Operator Panel</h2>
<a href="operatorDashboard.html">Dashboard</a>
<a href="mytickets.html">My Tickets</a>
<a href="#" onclick="logout()" class="logout-btn">Logout</a>
</div>

<div class="main" id="main">

<div class="topbar">
<button class="menu-btn" onclick="toggleSidebar()">â˜° Menu</button>
<h1>Operator Dashboard</h1>
</div>

<div class="kpi-cards">
<div class="kpi"><h4>Tickets Assigned</h4><h2 id="totalAssigned">0</h2></div>
<div class="kpi"><h4>In Progress</h4><h2 id="inProgress">0</h2></div>
    <div class="kpi"><h4>Completed</h4><h2 id="closedCount">0</h2></div>

<div class="kpi"><h4>Completion Rate</h4><h2 id="completionRate">0%</h2></div>
</div>

<div class="middle-grid">

<div class="left-section">

<div class="block">
<h3>My Tickets</h3>

<div class="table-container">
<table>
<thead>
<tr>
<th>#</th>
<th>Title</th>
<th>Priority</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="ticketTable"><tr class="loading-row"><td colspan="5">Loading tickets</td></tr></tbody>
</table>
</div>

</div>

<div class="chart-box">
<h3>Average Tickets Created</h3>
<canvas id="avgChart"></canvas>
</div>

</div>

<div class="right-section">

<div class="chart-box">
<h3>Ticket Priority</h3>
<canvas id="priorityChart"></canvas>
</div>

<div class="recent-box">
<h3>Recent Tickets</h3>
<div id="recentTickets"></div>
</div>

</div>

</div>
</div>

<script>
const socket = window.io ? window.io() : { on: () => {} };

// Apply dark mode
if (localStorage.getItem("darkMode") === "enabled") {
  document.body.classList.add("dark");
}

/* âœ… FIX 1: Validate operator */
// Your tickets are seeded with assignedTo = "operator" in db.js/server.js.
// Login stores operator.id into localStorage under "username".
// So we must fall back to the literal "operator" to make the dashboard query match.
let operatorName = localStorage.getItem("operatorName") || localStorage.getItem("username");
const ticketsCacheKey = "operatorTickets";
let loadingPromise = null;
let hasRenderedTickets = false;
let chartLibraryPromise = null;

function escapeHtml(value) {
  const node = document.createElement("div");
  node.textContent = value == null ? "" : String(value);
  return node.innerHTML;
}

function animateNumber(id, value, suffix = "") {
  const element = document.getElementById(id);
  if (!element) return;
  const target = Number(value) || 0;
  const start = Number(element.dataset.value || 0);
  element.dataset.value = String(target);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || start === target) {
    element.textContent = `${target}${suffix}`;
    return;
  }
  const startedAt = performance.now();
  const duration = 520;
  const step = (now) => {
    const progress = Math.min((now - startedAt) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    element.textContent = `${Math.round(start + (target - start) * eased)}${suffix}`;
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function loadChartLibrary() {
  if (typeof Chart !== "undefined") return Promise.resolve();
  if (chartLibraryPromise) return chartLibraryPromise;

  chartLibraryPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Chart library could not be loaded"));
    document.head.appendChild(script);
  });
  return chartLibraryPromise;
}


/* ===============================
   LOAD TICKETS
================================ */
async function loadTickets(){
  if (loadingPromise) return loadingPromise;
  const cached = localStorage.getItem(ticketsCacheKey);
  if (cached) {
    try {
      const cachedTickets = JSON.parse(cached);
      if (Array.isArray(cachedTickets) && cachedTickets.length) {
        document.getElementById("ticketTable").innerHTML = cachedTickets.map((ticket, i) =>
          `<tr><td>${i + 1}</td><td>${escapeHtml(ticket.title)}</td><td><span class="badge ${escapeHtml(ticket.priority)}">${escapeHtml(ticket.priority)}</span></td><td>${escapeHtml(ticket.status)}</td><td>Refreshing...</td></tr>`
        ).join("");
        hasRenderedTickets = true;
      }
    } catch (err) {
      localStorage.removeItem(ticketsCacheKey);
    }
  }
  loadingPromise = (async () => {
  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const identity = await fetch("/api/me", { cache: "no-store" });
    if (!identity.ok) throw new Error("Session expired");
    const me = await identity.json();
    if (me.role !== "operator") throw new Error("Operator access required");
    operatorName = me.id;
    const res = await fetch(`/api/tickets/operator/${encodeURIComponent(operatorName)}/summary`, {
      cache: "no-store",
      signal: controller.signal
    });
    clearTimeout(timeout);

    if(!res.ok) throw new Error("Failed to fetch tickets");

    const payload = await res.json();
    const tickets = Array.isArray(payload) ? payload : payload.tickets;
    const counts = payload.counts || {};
    localStorage.setItem(ticketsCacheKey, JSON.stringify(tickets));
    hasRenderedTickets = true;

const normalizeStatus = (s) => (String(s || "").trim().toLowerCase());

    const total = Number(counts.total ?? tickets.length);
    const inProgress = Number(counts.inProgress || 0);
    const completed = Number(counts.completed || 0);


    animateNumber("totalAssigned", total);
    animateNumber("inProgress", inProgress);
    animateNumber("closedCount", completed);
    animateNumber("completionRate", total ? Math.round((completed / total) * 100) : 0, "%");


    /* TABLE */
    const tbody = document.getElementById("ticketTable");
    const rows = [];

    tickets.forEach((ticket,i) => {

      let actionButtons = "";

      const st = (String(ticket.status || "").trim());
      if(st === "Assigned"){
        actionButtons = `<button class="action progress-btn"
        onclick="updateStatus(${ticket.id},'In Progress')">Start</button>`;
      }
      else if(st === "In Progress"){
        actionButtons = `<button class="action close-btn"
        onclick="updateStatus(${ticket.id},'Completed')">Close</button>`;
      }
      else{
        actionButtons = "Completed";
      }



      rows.push(`
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(ticket.title)}</td>
        <td><span class="badge ${escapeHtml(ticket.priority)}">${escapeHtml(ticket.priority)}</span></td>
        <td>${escapeHtml(ticket.status)}</td>
        <td>${actionButtons}</td>
      </tr>`);
    });
    tbody.innerHTML = rows.join("");

    /* RECENT */
    const recentDiv = document.getElementById("recentTickets");
    const recentRows = [];

    tickets.slice(0, 5).forEach(ticket => {

      let statusClass = "status-open";

      if(ticket.status === "Assigned") statusClass = "status-open";
      else if(ticket.status === "In Progress") statusClass = "status-progress";
      else if(ticket.status === "Completed") statusClass = "status-closed";


      recentRows.push(`
      <div class="recent-ticket-row">
        <div>
          <strong>${escapeHtml(ticket.title)}</strong><br>
          <small>${escapeHtml(ticket.status)}</small>
        </div>
        <span class="status-badge ${statusClass}">${escapeHtml(ticket.status)}</span>
      </div>`);
    });
    recentDiv.innerHTML = recentRows.join("");

    /* Load charts after ticket data so a CDN problem cannot block the dashboard. */
    await loadChartLibrary();

    /* CHART */
    const high = Number(counts.high || 0);
    const medium = Number(counts.medium || 0);
    const low = Number(counts.low || 0);

    if(window.priorityChartObj) window.priorityChartObj.destroy();

    window.priorityChartObj = new Chart(document.getElementById("priorityChart"), {
      type:'doughnut',
      data:{
        labels:["High","Medium","Low"],
        datasets:[{
          data:[high,medium,low],
          backgroundColor:["#ef4444","#f59e0b","#10b981"]
        }]
      },
      options:{
        rotation:-90,
        circumference:180,
        cutout:"65%",
        maintainAspectRatio:false,
        layout:{ padding:{ bottom:20 }},
        plugins:{ legend:{ position:"bottom" }}
      }
    });

    if(window.avgChartObj) window.avgChartObj.destroy();

    window.avgChartObj = new Chart(document.getElementById("avgChart"), {
      type:'bar',
      data:{
        labels:["Week1","Week2","Week3","Week4"],
        datasets:[{
          label:"Tickets",
          data:[2,3,2,1],
          backgroundColor:"#22c55e",
          borderRadius:8
        }]
      },
      options:{
        maintainAspectRatio:false,
        plugins:{ legend:{ display:true }}
      }
    });

  }catch(err){
    console.error("âŒ Load error:", err);
    if (!hasRenderedTickets) {
      document.getElementById("ticketTable").innerHTML =
        `<tr><td colspan="5" style="text-align:center;padding:24px;color:#dc2626">Unable to load tickets. Please refresh.</td></tr>`;
    }
  }
  })();
  try { await loadingPromise; } finally { loadingPromise = null; }
}

/* ===============================
   UPDATE STATUS
================================ */
async function updateStatus(id,status){
  try{
    const res = await fetch(`/api/tickets/${id}/status`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status})
    });

    if(!res.ok) throw new Error("Update failed");

    /* âœ… FIX 3: wait + reload */
    await loadTickets();

  }catch(err){
    console.error("âŒ Update error:", err);
  }
}

/* ===============================
   REALTIME
================================ */
socket.on("ticketStatusUpdated", () => {
  loadTickets();
});

socket.on("newTicket", () => {
  loadTickets();
});

/* ===============================
   SIDEBAR
================================ */
function toggleSidebar(){
  const sidebar = document.getElementById("sidebar");
  const main = document.getElementById("main");

  sidebar.classList.toggle("collapsed");
  main.classList.toggle("full");
}

/* ===============================
   LOGOUT
================================ */
function logout(){
  localStorage.removeItem("operatorName");
  window.location.href = "role.html";
}

/* ===============================
   INITIAL LOAD
================================ */
loadTickets();
</script>

</body>
</html>
