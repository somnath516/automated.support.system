<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logo/logo.png">
<style>
:root {
    --motion-fast: 180ms;
    --motion-med: 420ms;
}

* {
    scroll-behavior: smooth;
    box-sizing: border-box;
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    background: #f4f6f9;
    overflow-x: hidden;
    transition: background-color 0.25s ease, color 0.25s ease;
}

/* SIDEBAR */
.sidebar {
    width: 270px;
    background: #1f2937;
    color: white;
    height: 100vh;
    padding: 20px;
    position: fixed;
    left: 0;
    top: 0;
    transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
}

.sidebar.collapsed {
    transform: translateX(-100%);
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 40px;
}


.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #374151;
    color: white;
    transform: translateX(5px);
}

.logout-btn {
    color: #f87171 !important;
}

.logout-btn:hover {
    background: #7f1d1d;
}

hr {
    border: 0;
    border-top: 1px solid #374151;
    margin: 20px 0;
}

/* MAIN */
.main {
    flex: 1;
    margin-left: 0;
    padding: 30px 40px;
    transition: margin-left 360ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: margin-left;
    width: auto;
    min-width: 0;
}

.main.full {
    margin-left: 270px;
}

/* TOPBAR */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.menu-btn {
    background: #1f2937;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.menu-btn:hover {
    background: #111827;
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 12px 30px rgba(17,24,39,0.20);
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    transition: transform var(--motion-fast) ease, box-shadow var(--motion-fast) ease, background-color var(--motion-fast) ease;
    animation: riseIn var(--motion-med) ease both;
}

@keyframes riseIn {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 26px rgba(0,0,0,0.10);
}

/* CHARTS */
.charts {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
    gap: 20px;
}

.chart-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* TABLE */
.table-section {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.dashboard-status {
    min-height: 24px;
    margin: -16px 0 18px;
    color: #6b7280;
}
.dashboard-status.error { color: #b91c1c; }
.retry-btn { background: #2563eb; color: white; }
@media (max-width: 900px) {
    .charts { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
    .main { padding: 20px 16px; }
    .cards, .charts { grid-template-columns: 1fr; }
    .sidebar { width: 270px; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
}

/* ðŸ”¥ DARK MODE */
body.dark {
    background: #111827;
    color: #f9fafb;
}

body.dark .card,
body.dark .chart-box,
body.dark .table-section {
    background: #1f2937;
}

body.dark table th {
    background: #374151;
}

body.dark table td {
    border-color: #374151;
}

body.dark canvas {
    filter: brightness(0.85);
}
</style>
</head>

<body>

<div class="sidebar collapsed" id="sidebar">
    <h2>Support Admin</h2>
    <a href="adminDashboard.html">Dashboard</a>
    <a href="tickets.html">Tickets</a>
    <a href="operators.html">Operators</a>
    <a href="settings.html">Settings</a>
    <hr>
    <a href="#" onclick="logout()" class="logout-btn">Logout</a>
</div>

<div class="main" id="main">

<div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Menu
    </button>
    <h1>Admin Dashboard</h1>
</div>
<div class="cards">
    <div class="card">
        <h3>Total Tickets</h3>
        <h2 id="totalTickets">0</h2>
    </div>
    <div class="card">
        <h3>Open Tickets</h3>
        <h2 id="openTickets">0</h2>
    </div>
    <div class="card">
        <h3>Completed Tickets</h3>
        <h2 id="closedTickets">0</h2>
    </div>
    <div class="card">
        <h3>Assigned Tickets</h3>
        <h2 id="assignedTickets">0</h2>
    </div>
</div>

<div class="charts">
    <div class="chart-box">
        <h3>Ticket Status Overview</h3>
        <canvas id="statusChart"></canvas>
    </div>

    <div class="chart-box">
        <h3>Priority Distribution</h3>
        <canvas id="priorityChart"></canvas>
    </div>
</div>

<div class="table-section">
    <h3>Recent Tickets</h3>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned To</th>
            </tr>
        </thead>
        <tbody id="ticketTable"></tbody>
    </table>
</div>

</div>

<script>
// âœ… APPLY DARK MODE (ONLY READ FROM SETTINGS)
window.onload = () => {
    if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("dark");
    }
};

let statusChartInstance;
let priorityChartInstance;

function escapeHtml(value) {
    const node = document.createElement("div");
    node.textContent = value == null ? "" : String(value);
    return node.innerHTML;
}

function animateNumber(id, value, suffix = "") {
    const element = document.getElementById(id);
    if (!element) return;
    const target = Number(value) || 0;
    const start = Number(element.dataset.value || 0);
    element.dataset.value = String(target);
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || start === target) {
        element.textContent = `${target}${suffix}`;
        return;
    }
    const startedAt = performance.now();
    const duration = 520;
    const step = (now) => {
        const progress = Math.min((now - startedAt) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        element.textContent = `${Math.round(start + (target - start) * eased)}${suffix}`;
        if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

let chartLibraryPromise;
function loadChartLibrary() {
    if (typeof Chart !== "undefined") return Promise.resolve();
    if (chartLibraryPromise) return chartLibraryPromise;
    chartLibraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Chart library unavailable"));
        document.head.appendChild(script);
    });
    return chartLibraryPromise;
}

async function loadDashboard() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
    const res = await fetch("/api/tickets/summary", { signal: controller.signal, cache: "no-store" });
    clearTimeout(timeout);
    if (res.status === 401 || res.status === 403) {
        window.location.href = "role.html";
        return;
    }
    if (!res.ok) throw new Error("Dashboard request failed");
    const payload = await res.json();
    const tickets = payload.recent || [];
    const counts = payload.counts || {};

    let assignedCount = Number(counts.assigned || 0);
    let inProgressCount = Number(counts.inProgress || 0);
    let closedCount = Number(counts.completed || 0);

    let high = Number(counts.high || 0);
    let medium = Number(counts.medium || 0);
    let low = Number(counts.low || 0);

    const openCount = assignedCount + inProgressCount;

    animateNumber("totalTickets", counts.total);
    animateNumber("openTickets", openCount);
    animateNumber("closedTickets", closedCount);
    animateNumber("assignedTickets", assignedCount);

    const table = document.getElementById("ticketTable");
    const rows = [];

    tickets.forEach(ticket => {
        rows.push(`
            <tr>
                <td>${escapeHtml(String(ticket.title || "").replace(/\s+#\d+\s*$/, ""))}</td>
                <td>${escapeHtml(ticket.priority)}</td>
                <td>${escapeHtml(ticket.status)}</td>
                <td>${escapeHtml(ticket.assignedTo || "Unassigned")}</td>
            </tr>
        `);
    });
    table.innerHTML = rows.join("");

    try {
        await loadChartLibrary();
    } catch (chartError) {
        console.warn("Charts unavailable:", chartError);
        return;
    }
    if (statusChartInstance) statusChartInstance.destroy();
    if (priorityChartInstance) priorityChartInstance.destroy();

    statusChartInstance = new Chart(
        document.getElementById("statusChart"),
        {
            type: "bar",
            data: {
                labels: ["Assigned", "In Progress", "Completed"],
                datasets: [{
                    data: [assignedCount, inProgressCount, closedCount],
                    backgroundColor: ["#3b82f6", "#f59e0b", "#10b981"]
                }]
            },
            options: {
                plugins: { legend: { display: false } }
            }
        }
    );

    priorityChartInstance = new Chart(
        document.getElementById("priorityChart"),
        {
            type: "doughnut",
            data: {
                labels: ["High", "Medium", "Low"],
                datasets: [{
                    data: [high, medium, low],
                    backgroundColor: ["#ef4444", "#f59e0b", "#10b981"]
                }]
            }
        }
    );
    } catch (error) {
        clearTimeout(timeout);
        console.error("Dashboard load failed:", error);
        status.className = "dashboard-status error";
        status.innerHTML = "Unable to load dashboard. <button class=\"retry-btn\" type=\"button\" onclick=\"loadDashboard()\">Retry</button>";
    }
}

// SIDEBAR
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("main").classList.toggle("full");
}

document.addEventListener('DOMContentLoaded', () => {
    // trigger layout/paint once for smoother first transition
    requestAnimationFrame(() => document.body.classList.add('ready'));
});

// LOGOUT
function logout() {
    fetch("/api/logout", { method: "POST" }).finally(() => {
        window.location.href = "/role.html";
    });
}


loadDashboard();
</script>

</body>
</html>
